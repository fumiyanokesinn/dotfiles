# =====================================
# Ultra minimal 2-line prompt
# =====================================

add_newline = true
command_timeout = 1000

# ブランチ行は git 管理下でのみ出す（括弧内が空なら改行ごと消える）
format = "$directory($git_branch$git_status\n)$cmd_duration$character"

# ---- 上段：ディレクトリのみ ----
[directory]
format = "[$path]($style) \n"
style = "bold 255 bg:25"
truncation_length = 3
truncate_to_repo = false

# ---- 下段：入力カーソルのみ ----
[character]
success_symbol = "[❯](bold 47)"
error_symbol   = "[❯](bold 9)"

# ---- すべて無効化 ----
[username]
disabled = true

[hostname]
disabled = true

[git_branch]
disabled = false
format = "on [$branch]($style) "
style = "bold purple"

# 上流ブランチとの差分コミット数のみ（⇡ 未push / ⇣ 未pull。⇣ は最後の fetch 時点）
[git_status]
disabled = false
format = "[$ahead_behind]($style)"
style = "bold cyan"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"

[git_state]
disabled = true

[git_commit]
disabled = true

[git_metrics]
disabled = true

[nodejs]
disabled = true

[golang]
disabled = true

[python]
disabled = true

[rust]
disabled = true

[docker_context]
disabled = true

[kubernetes]
disabled = true

[gcloud]
disabled = true

[aws]
disabled = true

[env_var]
disabled = true

[package]
disabled = true

[cmd_duration]
disabled = false
min_time = 0
format = "took [$duration]($style)\n"
style = "bold yellow"

[terraform]
disabled = true

[buf]
disabled = true

# 各モジュール末尾で改行するため既定の改行は不要
[line_break]
disabled = true
